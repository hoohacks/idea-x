name: Deploy

# Publishing a GitHub Release puts the site live. Pushing to main does not --
# that was the old behaviour, and it meant every merge was a deploy whether or
# not anyone intended one.
#
# `workflow_dispatch` is the emergency handle: it redeploys whatever is on the
# chosen ref without cutting a release, for the day of the event when something
# needs to go out now.
on:
  release:
    types: [published]
  workflow_dispatch:

# Two releases published close together would otherwise race to write gh-pages
# and the loser could be the one that sticks.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache the Firebase emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Install
        run: npm ci

      # A release is not the moment to find out the tests are red.
      - name: Unit tests
        run: npm run test:ci

      - name: Security rules
        run: npm run test:rules

      # Registration is CLOSED unless the repository variable says otherwise, so
      # a deploy that forgets it keeps strangers out rather than letting them
      # in. Flip it in Settings -> Secrets and variables -> Actions -> Variables,
      # then run this workflow again; no code change and no pull request.
      - name: Build
        run: npm run build
        env:
          VITE_REGISTRATION_OPEN: ${{ vars.REGISTRATION_OPEN }}

      - name: Say which way the doors are
        run: |
          if [ "${{ vars.REGISTRATION_OPEN }}" = "true" ]; then
            echo "### Registration is OPEN on this deploy" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Registration is CLOSED on this deploy" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Set the repository variable \`REGISTRATION_OPEN\` to \`true\` and re-run to open it." >> $GITHUB_STEP_SUMMARY
            echo "Organizers can still sign in at \`#/login?staff\`." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          commit_message: "Deploy ${{ github.event.release.tag_name || github.sha }}"

      # database.rules.json and storage.rules are NOT deployed here -- they are
      # published by hand in the Firebase console, by choice. src/schema.test.js
      # fails when the rules change without the version marker being bumped, so
      # this is the reminder that goes with that.
      - name: Remind about the rules
        run: |
          echo "### Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If \`database.rules.json\` or \`storage.rules\` changed in this release," >> $GITHUB_STEP_SUMMARY
          echo "publish them in the Firebase console now. Nothing here does it for you." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          grep -o 'rulesVersion: [0-9]*' database.rules.json >> $GITHUB_STEP_SUMMARY || true

  # Tells the team's Discord what happened to a release: live, or failed and
  # why to look. A job of its own, after the deploy, so it can report either
  # outcome -- a step inside the deploy job would never run once a test failed,
  # which is exactly the release people most need to hear about.
  #
  # Runs for releases only: a manual redeploy from the Actions tab is somebody
  # already watching it happen.
  notify:
    name: Tell Discord
    needs: deploy
    if: always() && github.event_name == 'release' && needs.deploy.result != 'cancelled'
    runs-on: ubuntu-latest

    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESULT: ${{ needs.deploy.result }}
          TAG: ${{ github.event.release.tag_name }}
          NAME: ${{ github.event.release.name }}
          NOTES: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          AUTHOR: ${{ github.event.release.author.login }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REGISTRATION_OPEN: ${{ vars.REGISTRATION_OPEN }}
          SITE_URL: https://hoohacks.github.io/idea-x
        run: |
          # A missing secret should not turn a good deploy red.
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::DISCORD_WEBHOOK_URL is not set, so no Discord message was sent."
            exit 0
          fi

          if [ "$RESULT" = "success" ]; then
            TITLE="${NAME:-$TAG} is live"
            COLOR=1064997      # the success green, #103c25
            STATUS="Deployed"
          else
            TITLE="${NAME:-$TAG} did not deploy"
            COLOR=10357258     # the error oxblood, #9e0a0a
            STATUS="Failed. The site is still on the previous release."
          fi

          if [ "$REGISTRATION_OPEN" = "true" ]; then
            DOORS="Open"
          else
            DOORS="Closed (organizers can still sign in at #/login?staff)"
          fi

          # Discord caps an embed description at 4096 characters; release notes
          # are cut well short of that and point at the full release instead.
          if [ -z "$NOTES" ]; then
            SUMMARY="No release notes."
          elif [ ${#NOTES} -gt 1500 ]; then
            SUMMARY="${NOTES:0:1500}..."
          else
            SUMMARY="$NOTES"
          fi

          # jq builds the JSON, so quotes and newlines in the release notes
          # cannot break the payload.
          jq -n \
            --arg title "$TITLE" \
            --arg url "$RELEASE_URL" \
            --arg summary "$SUMMARY" \
            --arg status "$STATUS" \
            --arg tag "$TAG" \
            --arg author "$AUTHOR" \
            --arg doors "$DOORS" \
            --arg site "$SITE_URL" \
            --arg run "$RUN_URL" \
            --arg prerelease "$PRERELEASE" \
            --argjson color "$COLOR" \
            '{
              username: "Ideathon deploys",
              embeds: [{
                title: $title,
                url: $url,
                description: $summary,
                color: $color,
                fields: ([
                  { name: "Status", value: $status, inline: false },
                  { name: "Version", value: ("`" + $tag + "`" + (if $prerelease == "true" then " (pre-release)" else "" end)), inline: true },
                  { name: "Released by", value: $author, inline: true },
                  { name: "Registration", value: $doors, inline: false },
                  { name: "Links", value: ("[Site](" + $site + ") | [Release](" + $url + ") | [Deploy log](" + $run + ")"), inline: false }
                ]),
                timestamp: (now | todate)
              }]
            }' > payload.json

          # --fail-with-body so a rejected webhook shows Discord's reason in the
          # log rather than a bare exit code
          curl --silent --show-error --fail-with-body \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$WEBHOOK"
